name: NoLife
version: '${project.version}'
main: com.longswordsmp.nolife.NoLifePlugin
api-version: '1.21'
authors: [longswordsmp]
description: A three-life survival plugin with elimination, revives, Book of Life and Life Gems.

# Note: the nolife.admin permission is enforced inside the command handler
# (so the configurable messages.yml "no-permission" text is shown). It is
# intentionally not declared here, as Bukkit would otherwise reject the sender
# with its own generic message before the handler runs.
commands:
  setlives:
    description: Set a player's lives.
    usage: /setlives <player> <amount>
  revive:
    description: Revive an eliminated player at your location.
    usage: /revive <player>
  eliminate:
    description: Eliminate (death-ban) a player.
    usage: /eliminate <player>
  nlreload:
    description: Reload the NoLife config and resend the resource pack.
    usage: /nlreload

permissions:
  nolife.admin:
    description: Grants access to all NoLife admin commands.
    default: op
  nolife.use.book:
    description: Allows using the Book of Life to revive players.
    default: true
  nolife.use.lifegem:
    description: Allows using a Life Gem to gain a life.
    default: true
