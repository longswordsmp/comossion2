name: NoLife
version: '${project.version}'
main: com.longswordsmp.nolife.NoLifePlugin
api-version: '1.21'
authors: [longswordsmp]
description: A three-life survival plugin with elimination, revives, Book of Life and Life Gems.

# Note: permissions are enforced inside the command handlers (so the
# configurable messages.yml "no-permission" text is shown). They are
# intentionally not declared per-command here, as Bukkit would otherwise reject
# the sender with its own generic message before the handler runs.
commands:
  nolife:
    description: Open the NoLife admin menu.
    usage: /nolife
    aliases: [nl]
  setlives:
    description: Set a player's lives (use 'admin' for infinite).
    usage: /setlives <player> <amount|admin>
  revive:
    description: Revive an eliminated player at your location.
    usage: /revive <player>
  eliminate:
    description: Eliminate (death-ban) a player.
    usage: /eliminate <player>
  nlgive:
    description: Give a Book of Life or Life Gem.
    usage: /nlgive [player] <book|gem> [amount]
  nlreload:
    description: Reload the NoLife config and resend the resource pack.
    usage: /nlreload
  lives:
    description: Show your (or another player's) lives.
    usage: /lives [player]
  nlrecipes:
    description: Show the Book of Life and Life Gem recipes.
    usage: /nlrecipes
    aliases: [nlrecipe]
  bounty:
    description: Place, reclaim or view Life Gem bounties on players.
    usage: /bounty <add|remove|list> [player] [amount]
    aliases: [bounties]
  godmode:
    description: Toggle god mode (take no damage) for yourself.
    usage: /godmode [on|off]
    aliases: [god]

permissions:
  nolife.admin:
    description: Grants access to all NoLife admin commands.
    default: op
  nolife.use.book:
    description: Allows using the Book of Life to revive players.
    default: true
  nolife.use.lifegem:
    description: Allows using a Life Gem to gain a life.
    default: true
  nolife.lives:
    description: Allows using /lives to view your own life count.
    default: true
  nolife.recipes:
    description: Allows using /nlrecipes to view the crafting recipes.
    default: true
  nolife.bounty:
    description: Allows placing, reclaiming and viewing bounties with /bounty.
    default: true
  nolife.godmode:
    description: Allows toggling god mode with /godmode.
    default: op
