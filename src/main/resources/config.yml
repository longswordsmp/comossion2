# ------------------------------------------------------------------
#  WitherStrikeCannon
#  Right click the rod, and a 120 block wide orbital barrage lands on
#  whatever you were looking at.
#
#  NOTE: if you are upgrading from an older version, DELETE this file
#  and restart so the new defaults are written.
# ------------------------------------------------------------------

targeting:
  # RAYTRACE - right clicking fires instantly at whatever block you are
  #            looking at, up to max-distance blocks away (default - the
  #            blast is far too big to stand next to).
  # BOBBER   - cast the rod and the strike lands where the bobber lands.
  #            Limited to fishing rod range, so you WILL be inside the
  #            crater. Fun, but bring a totem.
  mode: RAYTRACE

  # RAYTRACE mode only: how far the aiming ray reaches.
  max-distance: 300.0

  # BOBBER mode only: give up and strike wherever the bobber is after
  # this many ticks in flight (20 ticks = 1 second).
  hook-timeout-ticks: 120

strike:
  # How many wither skulls per shot.
  skull-count: 2000

  # Hard ceiling, so a typo in skull-count cannot take the server down.
  max-skull-count: 5000

  # Radius in blocks of the circle the skulls rain into. 60 = a 120 block
  # wide strike zone.
  spread: 60.0

  # How far each skull's impact point wanders from the column it fell
  # down. Small values keep the rain near vertical - large values make
  # the skulls streak across the sky at an angle.
  impact-jitter: 3.0

  # How far above the target the skulls spawn. Higher = longer fall.
  height: 140.0

  # Skulls are released across this many waves, one wave per
  # wave-delay-ticks, instead of all at once. 2000 entities in a single
  # tick is an instant TPS crater.
  waves: 120
  wave-delay-ticks: 1

  # Blue (charged) wither skulls instead of black ones.
  charged: false

  # 1.0 = exactly vanilla wither skull speed. Values above 1.0 make the
  # skulls accelerate faster than a real wither's shots.
  speed-multiplier: 1.0

  # Skulls ignore damage. With explosion.mode CUSTOM this just stops them
  # being popped early; in VANILLA mode it is also why surviving skulls
  # get launched skyward by the blasts below them.
  invulnerable: true

  # Seconds between shots, per player. 0 disables the cooldown.
  cooldown-seconds: 45

  # Cancel damage that a player's own barrage would deal to them.
  protect-shooter: true

  # Play the wither sounds and draw the targeting ring.
  effects: true

  # Only render the explosion effect on every Nth impact. 2000 explosion
  # particle packets in six seconds is a client side slideshow.
  impact-effect-every: 3

  # Worlds where the cannon refuses to fire, e.g. [world_spawn, lobby].
  disabled-worlds: []

explosion:
  # CUSTOM  - the vanilla blast is cancelled and the plugin carves the
  #           crater itself. Massively more destruction for far less CPU,
  #           and (importantly) nothing knocks the falling skulls around.
  #           Does NOT respect region protection plugins like WorldGuard.
  # VANILLA - let each skull explode normally, using power/block-damage
  #           below. Region plugins work, destruction is much smaller,
  #           and skulls get flung into the air by earlier impacts.
  mode: CUSTOM

  # CUSTOM mode: radius in blocks carved out around each impact. Combined
  # with spread 60 this digs roughly a 120 wide, 32 deep crater and removes
  # about 440,000 blocks per shot.
  blast-radius: 16.0

  # CUSTOM mode: how many blocks may be removed per tick. This is the
  # single most important performance dial - lower it if the server
  # stutters while a crater is forming, raise it for faster destruction.
  blocks-per-tick: 6000

  # CUSTOM mode: absolute cap on blocks removed by one strike. The queue
  # costs roughly 56 bytes per block, so 1,000,000 is about 56 MB of heap
  # while a strike is being carved. Raise it only if you raise the radii.
  max-blocks-per-strike: 1000000

  # CUSTOM mode: remove water and lava too. Leaving this false is much
  # kinder to TPS, since carved liquids immediately start flowing back.
  carve-liquids: false

  # CUSTOM mode: damage dealt to every living thing in the strike zone,
  # repeated damage-pulses times while the barrage lands.
  damage-per-pulse: 15.0
  damage-pulses: 16
  damage-pulse-interval-ticks: 10

  # VANILLA mode only.
  block-damage: true
  power: 4.0
  incendiary: false

item:
  name: '<gradient:#7b2cbf:#c77dff><bold>Wither Strike Cannon</bold></gradient>'
  lore:
    - '<dark_gray>Orbital ordnance, hand held.'
    - ''
    - '<gray>Right click to designate a target.'
    - '<gray>2000 wither skulls answer.'
  glint: true
  unbreakable: true

messages:
  prefix: '<dark_gray>[<gradient:#7b2cbf:#c77dff>WSC</gradient><dark_gray>] <reset>'
  no-permission: '<red>You do not have permission to do that.'
  player-only: '<red>Only players can use that.'
  player-not-found: '<red>%player% is not online.'
  received: '<gray>Cannon armed. <white>Right click to designate a target.'
  given: '<gray>Gave a cannon to <white>%player%<gray>.'
  reloaded: '<green>Configuration reloaded.'
  cooldown: '<red>Cannon recharging - <white>%seconds%s<red> remaining.'
  target-locked: '<gray>Target locked. <white>%count%<gray> wither skulls inbound.'
  no-target: '<red>Nothing in range to lock onto.'
  world-disabled: '<red>The cannon is disabled in this world.'
  usage: '<gray>Usage: <white>/witherstrikecannon <gray>| <white>/witherstrikecannon give [player] <gray>| <white>/witherstrikecannon reload'
